<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Assessment Reports - LIMS</title>
    <link rel="icon" href="https://i.imgur.com/s41tGvI.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
    <div th:replace="~{sidebar :: sidebar(activePage='reports', roleName='Senior Insurance Advisor')}"></div>
    <div class="main-content">
        <div class="table-container">
            <h2 class="mb-4">Risk Assessment Reports</h2>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Assessment ID</th>
                            <th>Application ID</th>
                            <th>Customer</th>
                            <th>Advisor</th>
                            <th>Risk Score</th>
                            <th>Recommendation</th>
                            <th>Assessment Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="assessment : ${assessments}">
                            <td th:text="${assessment.assessmentId}"></td>
                            <td th:text="${assessment.application.applicationId}"></td>
                            <td th:text="${assessment.application.user.firstName + ' ' + assessment.application.user.lastName}"></td>
                            <td th:text="${assessment.advisor.username}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${assessment.riskScore <= 30 ? 'bg-success' : 
                                                       (assessment.riskScore <= 60 ? 'bg-warning text-dark' : 'bg-danger')}" 
                                      th:text="${assessment.riskScore}"></span>
                            </td>
                            <td th:text="${assessment.recommendation}"></td>
                            <td th:text="${#dates.format(assessment.assessmentDate, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <a th:href="@{/sia/assessment/edit/{id}(id=${assessment.assessmentId})}" 
                                   class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <a th:href="@{/sia/assessment/delete/{id}(id=${assessment.assessmentId})}" 
                                   class="btn btn-sm btn-danger"
                                   th:if="${assessment.application.currentStatus.name() != 'Accepted'}"
                                   onclick="return confirm('Are you sure you want to delete this assessment?');">
                                    <i class="fas fa-trash"></i> Delete
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(assessments)}">
                            <td colspan="8" class="text-center">No assessments found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <a href="/sia/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('active'));
    </script>
</body>
</html>
