<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Payments - LIMS</title>
    <link rel="icon" href="https://i.imgur.com/s41tGvI.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
    <div th:replace="~{sidebar :: sidebar(activePage='payments', roleName='Finance Officer')}"></div>
    <div class="main-content">
        <div class="table-container">
            <h2 class="mb-4">Process Premium Payments</h2>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Policy Number</th>
                            <th>Customer</th>
                            <th>Annual Premium</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="policy : ${policies}">
                            <td th:text="${policy.policyNumber}"></td>
                            <td th:text="${policy.application.user.firstName + ' ' + policy.application.user.lastName}"></td>
                            <td th:text="${'$' + #numbers.formatDecimal(policy.annualPremium, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td><span class="badge bg-success" th:text="${policy.policyStatus}"></span></td>
                            <td>
                                <form th:action="@{/fo/record-payment}" method="post" class="d-inline">
                                    <input type="hidden" name="policyId" th:value="${policy.policyId}" />
                                    <input type="hidden" name="amount" th:value="${policy.annualPremium}" />
                                    <button type="submit" class="btn btn-sm btn-success">
                                        <i class="fas fa-check"></i> Record Payment
                                    </button>
                                </form>
                                <button type="button" class="btn btn-sm btn-info" 
                                        data-bs-toggle="modal" 
                                        th:data-bs-target="'#scheduleModal' + ${policy.policyId}">
                                    <i class="fas fa-calendar-alt"></i> Generate Schedule
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Payment Schedule Modals -->
            <div th:each="policy : ${policies}">
                <div class="modal fade" th:id="'scheduleModal' + ${policy.policyId}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/fo/generate-schedule}" method="post">
                                <div class="modal-header">
                                    <h5 class="modal-title">Generate Payment Schedule</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p><strong>Policy:</strong> <span th:text="${policy.policyNumber}"></span></p>
                                    <p><strong>Annual Premium:</strong> <span th:text="${'$' + #numbers.formatDecimal(policy.annualPremium, 0, 'COMMA', 2, 'POINT')}"></span></p>
                                    
                                    <div class="mb-3">
                                        <label for="scheduleType" class="form-label">Schedule Type *</label>
                                        <select class="form-select" id="scheduleType" name="scheduleType" required>
                                            <option value="annual">Annual (1 payment)</option>
                                            <option value="semi-annual">Semi-Annual (2 payments)</option>
                                            <option value="quarterly">Quarterly (4 payments)</option>
                                            <option value="monthly" selected>Monthly (12 payments)</option>
                                        </select>
                                    </div>
                                    <input type="hidden" name="policyId" th:value="${policy.policyId}">
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-check"></i> Generate Schedule
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <a href="/fo/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('active'));
    </script>
</body>
</html>
