<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History - LIMS</title>
    <link rel="icon" href="https://i.imgur.com/s41tGvI.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
    <div th:replace="~{sidebar :: sidebar(activePage='payment-history', roleName='Finance Officer')}"></div>
    <div class="main-content">
        <div class="table-container">
            <h2 class="mb-4">All Payment Records</h2>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Payment ID</th>
                            <th>Policy Number</th>
                            <th>Amount</th>
                            <th>Payment Date</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="payment : ${payments}">
                            <td th:text="${payment.paymentId}"></td>
                            <td th:text="${payment.policy.policyNumber}"></td>
                            <td th:text="${'$' + #numbers.formatDecimal(payment.amount, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#dates.format(payment.paymentDate, 'yyyy-MM-dd')}"></td>
                            <td th:text="${payment.type}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${payment.status.name() == 'Paid' ? 'bg-success' : 
                                                       (payment.status.name() == 'Due' ? 'bg-warning text-dark' : 
                                                       (payment.status.name() == 'Unused' ? 'bg-secondary' : 'bg-info'))}" 
                                      th:text="${payment.status}"></span>
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-warning" 
                                        data-bs-toggle="modal" 
                                        th:data-bs-target="'#updateModal' + ${payment.paymentId}"
                                        th:if="${payment.status.name() != 'Paid'}">
                                    <i class="fas fa-edit"></i> Update
                                </button>
                                <a th:href="@{/fo/payment/delete/{id}(id=${payment.paymentId})}" 
                                   class="btn btn-sm btn-danger"
                                   th:if="${payment.status.name() == 'Due' || payment.status.name() == 'Unused'}"
                                   onclick="return confirm('Are you sure you want to delete this payment record?');">
                                    <i class="fas fa-trash"></i> Delete
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(payments)}">
                            <td colspan="7" class="text-center">No payment records found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Update Payment Status Modals -->
            <div th:each="payment : ${payments}">
                <div class="modal fade" th:id="'updateModal' + ${payment.paymentId}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/fo/update-payment-status}" method="post">
                                <div class="modal-header">
                                    <h5 class="modal-title">Update Payment Status</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p><strong>Payment ID:</strong> <span th:text="${payment.paymentId}"></span></p>
                                    <p><strong>Policy:</strong> <span th:text="${payment.policy.policyNumber}"></span></p>
                                    <p><strong>Amount:</strong> <span th:text="${'$' + #numbers.formatDecimal(payment.amount, 0, 'COMMA', 2, 'POINT')}"></span></p>
                                    <p><strong>Current Status:</strong> <span th:text="${payment.status}"></span></p>
                                    
                                    <div class="mb-3">
                                        <label for="status" class="form-label">New Status *</label>
                                        <select class="form-select" id="status" name="status" required>
                                            <option value="Due">Due</option>
                                            <option value="Paid">Paid</option>
                                            <option value="Unused">Unused</option>
                                        </select>
                                    </div>
                                    <input type="hidden" name="paymentId" th:value="${payment.paymentId}">
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-check"></i> Update Status
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <a href="/fo/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('active'));
    </script>
</body>
</html>
